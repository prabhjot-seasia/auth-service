services:
  postgres:
    image: postgres:15-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_DB: auth_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - auth-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  auth-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auth-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: auth_service
      DB_SSL_MODE: disable
      SERVER_PORT: 8080
      SERVER_HOST: 0.0.0.0
      JWT_SECRET_KEY: your-production-secret-key-change-this
      JWT_ACCESS_TOKEN_TTL: 15
      JWT_REFRESH_TOKEN_TTL: 10080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - auth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  react-frontend:
    build:
      context: ./frontend/react-app
      dockerfile: Dockerfile
    container_name: auth-react-frontend
    ports:
      - "3001:80"
    depends_on:
      - auth-backend
    networks:
      - auth-network
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://auth-backend:8080

  nginx:
    image: nginx:alpine
    container_name: auth-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - auth-backend
      - react-frontend
    networks:
      - auth-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  auth-network:
    driver: bridge