services:
  postgres:
    image: postgres:15-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-auth_service}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT_EXTERNAL:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - auth-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - docker-db

  auth-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auth-backend
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-auth_service}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      SERVER_PORT: ${SERVER_PORT:-8080}
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_MODE: ${SERVER_MODE:-development}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-production-secret-key-change-this}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-10080}
      FRONTEND_URL: ${AUTH_FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    networks:
      - auth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SERVER_PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  react-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${AUTH_BACKEND_URL:-http://localhost:8080}
    container_name: auth-react-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - auth-backend
    networks:
      - auth-network
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://auth-backend:${SERVER_PORT:-8080}

  nginx:
    image: nginx:alpine
    container_name: auth-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - auth-backend
      - react-frontend
    networks:
      - auth-network
    restart: unless-stopped
    profiles:
      - nginx

volumes:
  postgres_data:
    driver: local

networks:
  auth-network:
    driver: bridge